<style>

/* 大螢幕模式下，彈出視窗要放大才看得清楚 */

<body>
<div id="root"></div>
<script>
// ============================================================
// ⚙️ 設定：貼上你的 Apps Script 部署網址
// ============================================================
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbw2LVxfHmnlggbhP5qH59mj_rOfdPkeit75peHD-GIwMBro6Ys2sNMPlBy6yaJTvKo/exec';
// 例如: 'https://script.google.com/macros/s/AKfycbzhuj80ozTlDJMka5TEvNCjdvj5fMFepQnckJ8c-wveTD1Wg9-yl83BfVw5w-PXxgC9/exec'
// 留空時會只使用 localStorage（離線模式）

// 存取金鑰：必須和 Code.gs 的指令碼屬性 CE_API_KEY 完全一致，否則後端會拒絕所有請求。
// 這把鑰匙寫在這裡本來就是公開可見的（跟 SCRIPT_URL 一樣），目的不是防高手，
// 是擋掉隨便搜到網址就亂打 API 的人。
const API_KEY = 'lm2v670kQyVh5SjNhot_t6N0xNBU0tSl';

const {useState,useEffect,useRef,useMemo} = React;
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const nowMs = () => Date.now();
const r1 = x => Math.round(x*10)/10;
const np = x => {const v=r1(x);return Number.isInteger(v)?String(v):v.toFixed(1);};
const money = (x,d=2) => Number(x).toLocaleString("en-US",{minimumFractionDigits:d,maximumFractionDigits:d});
const clock = t => new Date(t).toLocaleTimeString("zh-TW",{hour:"2-digit",minute:"2-digit",second:"2-digit"});

// ============================================================
// 投資標的（v7：改接真實行情）
// ------------------------------------------------------------
// 乙太幣／黃金／大盤指數(台灣加權指數) 的實際價格跟 K 線，現在由後端
// Apps Script 定期去抓真實資料（CoinGecko、Yahoo Finance）存成快取，
// 前端只負責跟後端要「目前的快取」，不再自己用公式算價格。
// 這裡只保留標的的基本資訊（id／名稱／icon），純粹給畫面顯示用。
// ============================================================
const ASSETS = [
  { id: 'eth',   name: '乙太幣',   icon: '⧫' },
  { id: 'gold',  name: '黃金',     icon: '🟡' },
  { id: 'index', name: '大盤指數', icon: '📈' }
];
const assetById_ = id => ASSETS.find(a => a.id === id);
const TIMEFRAMES = [
  { key: 'day',  label: '日線' },
  { key: 'week', label: '週線' }
];
function movingAverage(series, period) {
  const out = new Array(series.length).fill(null);
  let sum = 0;
  for (let i = 0; i < series.length; i++) {
    sum += series[i].close;
    if (i >= period) sum -= series[i - period].close;
    if (i >= period - 1) out[i] = sum / period;
  }
  return out;
}
/** 舊資料只有單一 eth／costBasis 欄位，第一次遇到時原封不動搬進 holdings.eth，之後以 holdings 為準。 */
function normalizeHoldings(s) {
  if (!s.holdings) s.holdings = {};
  if (!s.holdings.eth && (s.eth || s.costBasis)) s.holdings.eth = { qty: s.eth||0, costBasis: s.costBasis||0 };
  ASSETS.forEach(a => { if (!s.holdings[a.id]) s.holdings[a.id] = { qty: 0, costBasis: 0 }; });
  return s.holdings;
}
function totalAssetValue(s, prices) {
  let v = 0; ASSETS.forEach(a => { const h = s.holdings && s.holdings[a.id]; if (h) v += (h.qty||0) * (prices[a.id]||0); });
  return v;
}

// ===== API Bridge (fetch to Apps Script) =====
async function gs(action, payload) {
  if (!SCRIPT_URL) throw new Error('SCRIPT_URL 尚未設定');
  const body = {action, key: API_KEY};
  if (action === 'saveData') body.data = payload;
  else if (payload !== undefined) body.payload = payload;
  const resp = await fetch(SCRIPT_URL, {
    method: 'POST',
    headers: {'Content-Type': 'text/plain'},
    body: JSON.stringify(body),
    redirect: 'follow'
  });
  const text = await resp.text();
  // 注意：解析與錯誤判斷要分開。舊版把 throw 寫在 try 裡，
  // 後端回 {ok:false,error:...} 時會被自己的 catch 接走，變成「靜默成功」。
  let json;
  try {
    json = JSON.parse(text);
  } catch (e) {
    throw new Error('伺服器回應格式錯誤（可能是部署網址失效或未授權）：' + String(text).slice(0, 120));
  }
  if (!json.ok) throw new Error(json.error || 'API error');
  return json.result;
}

// v8.1：全班同時交易時，後端的全域鎖可能會短暫排隊逾時（不是分數不夠、不是沒有持倉
// 這種「真的不能做」的錯誤，純粹是排隊排太久）。這種情況重試幾次通常就過了——
// 交易逾時代表後端根本沒拿到鎖、完全沒有改到任何資料，重試是安全的，不會重複扣款。
// 業務邏輯錯誤（分數不足等）不需要重試，訊息會一樣，白白浪費時間，直接篩掉。
const NO_RETRY_MSG = ["分數不足","無法賣出","未知的投資標的","賣出比例不正確","找不到學生","投入分數不正確"];
async function investCall(action, payload, tries = 3) {
  for (let i = 0; i < tries; i++) {
    try { return await gs(action, payload); }
    catch (err) {
      const msg = err.message || "";
      const giveUp = NO_RETRY_MSG.some(k => msg.includes(k)) || i === tries - 1;
      if (giveUp) throw err;
      await new Promise(r => setTimeout(r, 700 * (i + 1)));
    }
  }
}

const HAS_GS = !!SCRIPT_URL;
const LS_CACHE = "ce.cache.v1";
const lsGet = k => {try{return localStorage.getItem(k);}catch(e){return null;}};
const lsSet = (k,v) => {try{localStorage.setItem(k,v);}catch(e){}};

const DEFAULT_SETTINGS = {
  answer:1, workbook:3, help:2, forget:-2,
  items:["紅筆","課本","習作","練習簿","聯絡簿"],
  bands:[{min:90,pts:5},{min:80,pts:3},{min:70,pts:1}],
  tutor:{base:3,threshold:10,perPoint:0.5},
  loanRate:0.01,
  kiosk:{enabled:false,pin:"",cooldown:8}
};
const newStudent = (name,extra) => {
  const x = (extra && typeof extra === "object") ? extra : {};
  return {id:uid(),name,
    seatNumber:x.seatNumber||"", studentNumber:x.studentNumber||"", gender:x.gender||"",
    points:0,eth:0,costBasis:0,holdings:{},loans:[],
    examTarget:80,examTargetSetAt:null,examGraded:false,
    history:[],gameProgress:{completed:[]}};
};
const newClass = (name,students=[]) => ({id:uid(),name,students});
function defaultBlob(){
  const jia=newClass("五年甲班"),yi=newClass("五年乙班");
  return {classes:{[jia.id]:jia,[yi.id]:yi},activeId:jia.id,settings:DEFAULT_SETTINGS};
}
function tutorBonus(imp,t){if(imp<=t.threshold) return 0;return r1(t.base+(imp-t.threshold)*t.perPoint);}
function examBonus(actual,target,bands){
  if(actual<target) return {ok:false,pts:0};
  for(const b of bands) if(actual>=b.min) return {ok:true,pts:b.pts};
  return {ok:true,pts:0};
}
function loanOwed(l,rate){const days=(nowMs()-l.start)/86400000;return l.principal*Math.pow(1+rate,days);}
function totalOwed(s,rate){return (s.loans||[]).reduce((a,l)=>a+loanOwed(l,rate),0);}
function netWorth(s,prices,rate){normalizeHoldings(s);return s.points+totalAssetValue(s,prices)-totalOwed(s,rate);}
function classNet(c,prices,rate){return c.students.reduce((a,s)=>a+netWorth(s,prices,rate),0);}

const canon = b => {
  const aid = b.activeId && b.classes[b.activeId] ? b.activeId : Object.keys(b.classes)[0];
  return JSON.stringify({classes:b.classes,activeId:aid,settings:{...DEFAULT_SETTINGS,...(b.settings||{})}});
};

// ===== Kiosk View（給孩子在大螢幕上自助登記用）=====
function KioskView({students, settings, prices, rate, className, applyDelta, open, buy, sell, repay, fInvest, setFInvest, fRepay, setFRepay, fAssetId, setFAssetId, fTf, setFTf, marketData, kioskStudentId, setKioskStudentId, setKioskMode, pushToast, cooldownUntil, setCooldownUntil}){
  const e = React.createElement;
  const [screen, setScreen] = useState('actions'); // 'actions' | 'market' | 'loan'
  const [exitPrompt, setExitPrompt] = useState(false);
  const [pinInput, setPinInput] = useState('');
  const [, forceTick] = useState(0);

  useEffect(() => {
    if (!cooldownUntil) return;
    const iv = setInterval(() => forceTick(x => x + 1), 300);
    return () => clearInterval(iv);
  }, [cooldownUntil]);

  const student = students.find(s => s.id === kioskStudentId);
  const cooldownSec = (settings.kiosk && settings.kiosk.cooldown) || 8;
  const cooldownLeft = Math.max(0, Math.ceil((cooldownUntil - Date.now()) / 1000));
  const onCooldown = cooldownLeft > 0;

  // 冷卻統一由 App 的 applyDelta 觸發，這樣走彈出視窗的操作（忘物／月考／輔導）也算數
  function quickAction(label, delta) {
    if (onCooldown) return;
    applyDelta(kioskStudentId, label, delta);
  }
  function openGated(kind) {
    if (onCooldown) return;
    open(kind, student.id);
  }

  function attemptExit() {
    if (pinInput === ((settings.kiosk && settings.kiosk.pin) || '')) {
      setExitPrompt(false); setPinInput(''); setKioskMode(false); setKioskStudentId(null);
    } else {
      pushToast('PIN 錯誤', 'down');
      setPinInput('');
    }
  }

  const exitModal = exitPrompt && e(Modal, {
    title: '輸入 PIN 結束大螢幕模式',
    onClose: () => { setExitPrompt(false); setPinInput(''); },
    foot: e(React.Fragment, null,
      e("button", { className: "btn gh", onClick: () => { setExitPrompt(false); setPinInput(''); } }, "取消"),
      e("button", { className: "btn pri", onClick: attemptExit }, "確認"))
  },
    e("div", { className: "field" },
      e("label", null, "PIN 碼"),
      e("input", { className: "inp mono", type: "password", autoFocus: true, value: pinInput, onChange: ev => setPinInput(ev.target.value), onKeyDown: ev => ev.key === "Enter" && attemptExit() }))
  );

  // ----- 還沒選人：大頭貼式名字牌 -----
  if (!student) {
    return e("div", { className: "kiosk" },
      e("div", { className: "kiosk-top" },
        e("h1", null, "點選你的名字"),
        e("button", { className: "kback", onClick: () => setExitPrompt(true) }, "🔒 結束")),
      students.length === 0
        ? e("div", { className: "empty" }, e("h2", null, "這個班級還沒有學生"))
        : e("div", { className: "kgrid" },
            students.map(s => e("div", {
              key: s.id, className: "ktile",
              onClick: () => { setKioskStudentId(s.id); setScreen('actions'); }
            }, s.name, e("span", { className: "kpts" }, np(s.points))))),
      exitModal);
  }

  // ----- 投資畫面（沿用 Market，鎖定成這位學生） -----
  if (screen === 'market') {
    return e("div", { className: "kiosk" },
      e("div", { className: "kiosk-top" }, e("h1", null, student.name, "．投資"),
        e("button", { className: "kback", onClick: () => setScreen('actions') }, "← 返回")),
      e(Market, { students: [student], trader: student, tradeId: student.id, setTradeId: () => {}, buy, sell, fInvest, setFInvest, fAssetId, setFAssetId, fTf, setFTf, marketData, className, hideSelector: true }),
      exitModal);
  }

  // ----- 借貸畫面（沿用 LoanCenter，鎖定成這位學生） -----
  if (screen === 'loan') {
    return e("div", { className: "kiosk" },
      e("div", { className: "kiosk-top" }, e("h1", null, student.name, "．借貸"),
        e("button", { className: "kback", onClick: () => setScreen('actions') }, "← 返回")),
      e("div", { style: { display: "flex", justifyContent: "center", marginBottom: 16 } },
        e("button", { className: "btn in", style: { fontSize: 20, padding: "14px 28px" }, onClick: () => open('borrow', student.id) }, "➕ 借入新款項")),
      e(LoanCenter, { students: [student], rate, repay, fRepay, setFRepay }),
      exitModal);
  }

  // ----- 主要動作畫面 -----
  return e("div", { className: "kiosk" },
    e("div", { className: "kiosk-top" },
      e("h1", null, student.name),
      e("button", { className: "kback", onClick: () => setExitPrompt(true) }, "🔒")),
    e("div", { style: { textAlign: "center", marginBottom: 6 } },
      e("div", { className: "note", style: { fontSize: 16 } }, className),
      e("div", { className: "kBigPts" }, np(student.points), e("span", { style: { fontSize: 20, fontFamily: "var(--cjk)", marginLeft: 8 } }, "分")),
      student.examTargetSetAt && !student.examGraded && e("div", { className: "note", style: { color: "var(--gold)", fontSize: 16, marginTop: 4 } }, "🎯 這次月考目標：", student.examTarget, " 分（等成績公布後登記）")),
    onCooldown && e("div", { className: "kCooldown" }, "請稍候 ", cooldownLeft, " 秒再操作"),
    e("div", { className: "kActionGrid" },
      e("button", { className: "kActBtn pos", disabled: onCooldown, onClick: () => quickAction("答題", settings.answer) }, "✅ 答題 +", settings.answer),
      e("button", { className: "kActBtn pos", disabled: onCooldown, onClick: () => quickAction("習作100", settings.workbook) }, "📘 習作 +", settings.workbook),
      e("button", { className: "kActBtn pos", disabled: onCooldown, onClick: () => quickAction("協助同學解決錯題", settings.help) }, "🤝 助人 +", settings.help),
      e("button", { className: "kActBtn neg", disabled: onCooldown, onClick: () => openGated("forget") }, "😅 忘記帶東西"),
      e("button", { className: "kActBtn", disabled: onCooldown, onClick: () => openGated("examtarget") }, "🎯 月考目標"),
      e("button", { className: "kActBtn", disabled: onCooldown, onClick: () => openGated("examscore") }, "📝 月考成績"),
      e("button", { className: "kActBtn", disabled: onCooldown, onClick: () => openGated("tutor") }, "🎓 輔導"),
      e("button", { className: "kActBtn", onClick: () => setScreen('market') }, "📈 投資"),
      e("button", { className: "kActBtn", onClick: () => setScreen('loan') }, "🏦 借貸"),
      e("button", { className: "kActBtn", onClick: () => open("leave", student.id) }, "🌴 請假")
    ),
    e("div", { style: { textAlign: "center", marginTop: 22 } },
      e("button", { className: "btn gh", style: { fontSize: 16, padding: "12px 24px" }, onClick: () => { setKioskStudentId(null); setScreen('actions'); } }, "↩️ 換人（下一位）")),
    exitModal);
}

// ===== Main App =====
function App(){
  const [loaded,setLoaded]=useState(false);
  const [classes,setClasses]=useState({});
  const [activeId,setActiveId]=useState(null);
  const [settings,setSettings]=useState(DEFAULT_SETTINGS);
  const [marketData,setMarketData]=useState(null); // 從後端 marketData 動作拿到的真實行情快取
  const [tab,setTab]=useState("overview");
  const [toasts,setToasts]=useState([]);
  const [modal,setModal]=useState(null);
  const [tradeId,setTradeId]=useState(null);
  const [lastSaved,setLastSaved]=useState(null);
  const [sync,setSync]=useState(HAS_GS?"ok":"err");
  const [kioskMode,setKioskMode]=useState(false);
  const [kioskStudentId,setKioskStudentId]=useState(null);
  const [kioskCooldownUntil,setKioskCooldownUntil]=useState(0);
  const [dbUrl,setDbUrl]=useState("");
  const [fSeat,setFSeat]=useState("");const [fNum,setFNum]=useState("");const [fGender,setFGender]=useState("");
  // Form states
  const [fItems,setFItems]=useState([]);
  const [fTarget,setFTarget]=useState("");const [fActual,setFActual]=useState("");
  const [fTutee,setFTutee]=useState("");const [fImp,setFImp]=useState("");
  const [fBorrow,setFBorrow]=useState("");const [fVal,setFVal]=useState("");const [fNote,setFNote]=useState("");
  const [fName,setFName]=useState("");const [fInvest,setFInvest]=useState("");const [fImport,setFImport]=useState("");
  const [fAssetId,setFAssetId]=useState("eth");const [fTf,setFTf]=useState("day");
  const [fLeaveType,setFLeaveType]=useState("病假");const [fLeaveDate,setFLeaveDate]=useState("");const [fLeaveNote,setFLeaveNote]=useState("");
  const [leaveBusy,setLeaveBusy]=useState(false);
  const [fRepay,setFRepay]=useState("");

  const settingsRef=useRef(settings);
  const lastBlobRef=useRef("");const lastRemoteRef=useRef("");const pendingRef=useRef(false);
  useEffect(()=>{settingsRef.current=settings;},[settings]);
  // 真實行情：跟後端要目前的快取，每 60 秒重新拿一次（後端本身每 15 分鐘才真的去外部 API 抓一次，
  // 這裡抓勤一點只是讓剛買賣完的畫面能快點反映，不會因此變得更即時）。
  useEffect(()=>{
    if(!loaded) return;
    let cancelled=false;
    // v8.1：行情後端 15 分鐘才真的更新一次，問太頻繁只是白白佔用 Apps Script 同時執行額度，
    // 全班同時用的時候尤其明顯，所以拉長到 3 分鐘一次，分頁切到背景時也暫停。
    const load=()=>{if(document.hidden) return; gs('marketData').then(d=>{if(!cancelled) setMarketData(d);}).catch(()=>{});};
    load();
    const iv=setInterval(load,180000);
    return ()=>{cancelled=true;clearInterval(iv);};
  },[loaded]);
  // 大螢幕模式時給 body 加上 class，讓彈出視窗自動放大
  useEffect(()=>{
    try{document.body.classList.toggle("kiosk-on",kioskMode);}catch(e){}
    return ()=>{try{document.body.classList.remove("kiosk-on");}catch(e){}};
  },[kioskMode]);


  const blobOf=(cl,aid,st)=>JSON.stringify({classes:cl,activeId:aid,settings:st});
  const setFromBlob=b=>{
    // v6：每位學生都補上 holdings（舊資料只有單一 eth/costBasis，搬進 holdings.eth 不會弄丟）
    Object.values(b.classes||{}).forEach(c=>(c.students||[]).forEach(normalizeHoldings));
    setClasses(b.classes);
    setActiveId(b.activeId&&b.classes[b.activeId]?b.activeId:Object.keys(b.classes)[0]);
    setSettings({...DEFAULT_SETTINGS,...(b.settings||{})});
  };

  // Load
  useEffect(()=>{(async()=>{
    let blob=null;
    let loadFailed=false;
    if(HAS_GS){
      try{const s=await gs("getData");if(s){blob=JSON.parse(s);}setSync("ok");}
      catch(e){setSync("err");loadFailed=true;}
    }
    if(loadFailed){
      // 後端連不上：只能顯示本機備份，絕對不可以把這個暫時畫面存回雲端，
      // 以免把雲端上的真實資料覆蓋成空白。等之後連線恢復，輪詢同步會自動抓回真實資料。
      const c=lsGet(LS_CACHE);if(c) try{blob=JSON.parse(c);}catch(_){}
      if(!blob) blob=defaultBlob();
      setFromBlob(blob);
      const cj=canon(blob);lastBlobRef.current=cj;
      // 注意：這裡刻意不設定 lastRemoteRef.current，也不呼叫 saveData。
    } else {
      // 成功連上後端（不論是拿到真實資料、還是真的第一次使用回傳空白）才可以視為「目前的事實」存回去
      if(!blob){const c=lsGet(LS_CACHE);if(c) try{blob=JSON.parse(c);}catch(_){}}
      if(!blob) blob=defaultBlob();
      setFromBlob(blob);
      const cj=canon(blob);lastBlobRef.current=cj;lastRemoteRef.current=cj;
      if(HAS_GS){try{await gs("saveData",cj);lastRemoteRef.current=cj;}catch(e){}}
    }
    if(HAS_GS){try{const u=await gs("getDatabaseUrl");if(u) setDbUrl(u);}catch(e){}}
    setLoaded(true);
  })();},[]);

  // Save (debounced)
  useEffect(()=>{
    if(!loaded) return;
    const js=blobOf(classes,activeId,settings);
    if(js===lastBlobRef.current) return;
    pendingRef.current=true;setSync("saving");
    const t=setTimeout(async()=>{
      lastBlobRef.current=js;lsSet(LS_CACHE,js);
      if(HAS_GS){
        try{await gs("saveData",js);lastRemoteRef.current=js;pendingRef.current=false;setSync("ok");setLastSaved(nowMs());}
        catch(e){pendingRef.current=false;setSync("err");pushToast("雲端儲存失敗，已存本機備援","down");}
      } else {pendingRef.current=false;setSync("ok");setLastSaved(nowMs());}
    },600);
    return ()=>clearTimeout(t);
  },[classes,activeId,settings,loaded]);

  // Polling sync
  useEffect(()=>{
    if(!loaded||!HAS_GS) return;
    const iv=setInterval(async()=>{
      if(document.hidden||pendingRef.current) return;
      try{const s=await gs("getData");
        if(s&&s!==lastRemoteRef.current){const b=JSON.parse(s);const cj=canon(b);lastRemoteRef.current=s;lastBlobRef.current=cj;setFromBlob(b);lsSet(LS_CACHE,cj);setSync("ok");}
      }catch(e){setSync("err");}
    },10000);
    return ()=>clearInterval(iv);
  },[loaded]);

  const prices=useMemo(()=>{
    const out={};
    ASSETS.forEach(a=>{out[a.id]=(marketData&&marketData.assets&&marketData.assets[a.id]&&marketData.assets[a.id].price)||0;});
    return out;
  },[marketData]);
  const rate=settings.loanRate;
  const classList=Object.values(classes);
  const active=classes[activeId];
  const students=active?active.students:[];
  const nameOf=id=>students.find(s=>s.id===id)?.name||"";
  const cur=modal?students.find(s=>s.id===modal.id):null;
  const trader=tradeId?students.find(s=>s.id===tradeId):null;
  const setStudents=fn=>setClasses(prev=>{const c=prev[activeId];if(!c) return prev;return {...prev,[activeId]:{...c,students:fn(c.students)}};});

  function pushToast(text,tone){const id=uid();setToasts(t=>[...t,{id,text,tone}]);setTimeout(()=>setToasts(t=>t.filter(x=>x.id!==id)),1900);}
  const logS=(s,label,delta)=>({...s,history:[{t:nowMs(),label,delta},...s.history].slice(0,60)});

  function bumpKioskCooldown(){
    if(!kioskMode) return;
    const sec=(settings.kiosk&&settings.kiosk.cooldown)||0;
    if(sec>0) setKioskCooldownUntil(nowMs()+sec*1000);
  }

  function applyDelta(id,label,delta){
    setStudents(prev=>prev.map(s=>s.id===id?{...logS(s,label,delta),points:r1(s.points+delta)}:s));
    if(delta!==0) pushToast(`${nameOf(id)}　${label}　${delta>0?"+":""}${np(delta)}`,delta>0?"up":"down");
    else pushToast(`${nameOf(id)}　${label}`,null);
    bumpKioskCooldown();
  }

  function open(kind,id){
    setModal({kind,id});
    const s=students.find(x=>x.id===id);
    if(kind==="forget") setFItems([]);
    if(kind==="examtarget") setFTarget(s?.examTarget!=null?String(s.examTarget):"80");
    if(kind==="examscore") setFActual("");
    if(kind==="tutor"){setFTutee("");setFImp("");}
    if(kind==="borrow") setFBorrow("");
    if(kind==="adjust"){setFVal("");setFNote("");}
    if(kind==="leave"){setFLeaveType("事假");setFLeaveDate(new Date().toISOString().slice(0,10));setFLeaveNote("");}
    if(kind==="rename"){setFName(s?.name||"");setFSeat(s?.seatNumber!=null?String(s.seatNumber):"");setFNum(s?.studentNumber||"");setFGender(s?.gender||"");}
    if(kind==="add"){setFName("");setFSeat("");setFNum("");setFGender("");}
    if(kind==="addclass") setFName("");
    if(kind==="renclass") setFName(active?.name||"");
    if(kind==="io") setFImport("");
  }
  const close=()=>setModal(null);

  function confirmForget(){if(!fItems.length) return close();applyDelta(modal.id,`忘記攜帶：${fItems.join("、")}`,fItems.length*settings.forget);close();}
  // ===== 月考：分成兩步驟 =====
  // ① 考前：學生自己設定目標（不加分，只記錄，delta 為 0）
  function confirmExamTarget(){
    const target=Number(fTarget);if(!Number.isFinite(target)) return;
    const label=`設定月考目標：${target}分`;
    setStudents(prev=>prev.map(s=>s.id===modal.id?{...logS(s,label,0),examTarget:target,examTargetSetAt:nowMs(),examGraded:false}:s));
    pushToast(`${nameOf(modal.id)}　設定月考目標 ${target} 分`,null);
    bumpKioskCooldown();close();
  }
  // ② 考後：輸入實際分數，一律用「考前已設定的目標」計算，不能臨時改目標
  function confirmExamScore(){
    const actual=Number(fActual);if(!Number.isFinite(actual)||!cur) return;
    const target=(cur.examTarget!=null)?cur.examTarget:80;
    const res=examBonus(actual,target,settings.bands);
    const label=res.ok?`月考達標（目標${target}／實際${actual}）`:`月考未達標（目標${target}／實際${actual}）`;
    setStudents(prev=>prev.map(s=>s.id===modal.id?{...logS(s,label,res.pts),points:r1(s.points+res.pts),examGraded:true}:s));
    pushToast(`${nameOf(modal.id)}　${label}　${res.pts>0?"+":""}${np(res.pts)}`,res.pts>0?"up":null);
    bumpKioskCooldown();close();
  }
  function confirmTutor(){
    const imp=Number(fImp);if(!fTutee||!Number.isFinite(imp)) return;
    const bonus=tutorBonus(imp,settings.tutor);
    applyDelta(modal.id,`輔導 ${nameOf(fTutee)}（進步${imp}分${bonus>0?"":"，未達門檻"}）`,bonus);close();
  }
  function confirmBorrow(){
    const amt=Number(fBorrow);if(!(amt>0)) return;
    setStudents(prev=>prev.map(s=>s.id===modal.id?{...logS(s,`借貸 +${np(amt)}（日息${(rate*100).toFixed(1)}%複利）`,amt),points:r1(s.points+amt),loans:[...s.loans,{id:uid(),principal:amt,start:nowMs()}]}:s));
    pushToast(`${nameOf(modal.id)}　借貸 +${np(amt)}`,"up");bumpKioskCooldown();close();
  }

  // ===== 還款（支援部分還款）=====
  function repay(sid,loan,partialAmt){
    const owed=loanOwed(loan,rate);
    const amt=partialAmt!=null?Math.min(partialAmt,owed):owed;
    if(amt<=0) return;
    const isFullRepay=amt>=owed-0.001;

    if(isFullRepay){
      const interest=owed-loan.principal;
      setStudents(prev=>prev.map(s=>s.id===sid?{...logS(s,`還款 −${np(owed)}（利息${np(interest)}）`,-owed),points:r1(s.points-owed),loans:s.loans.filter(l=>l.id!==loan.id)}:s));
      pushToast(`${nameOf(sid)}　還清借款 −${np(owed)}`,"down");
    } else {
      const remaining=owed-amt;
      setStudents(prev=>prev.map(s=>s.id===sid?{
        ...logS(s,`部分還款 −${np(amt)}（剩餘${np(remaining)}）`,-amt),
        points:r1(s.points-amt),
        loans:s.loans.map(l=>l.id===loan.id?{...l,principal:remaining,start:nowMs()}:l)
      }:s));
      pushToast(`${nameOf(sid)}　部分還款 −${np(amt)}，剩餘 ${np(remaining)}`,"down");
    }

// ===== K 線圖（SVG，含均線；有真實成交量才畫成交量） =====
function CandleChart({series}){
  const e=React.createElement;
  if(!series||series.length<2) return e("div",{className:"note",style:{marginTop:10,textAlign:"center",padding:"20px 0"}},"行情資料還沒抓回來，稍等一下，或請老師到 Apps Script 執行一次 refreshMarketCache_()。");
  const hasVolume=series.some(c=>c.volume!=null&&c.volume>0);
  const ma5=movingAverage(series,5),ma20=movingAverage(series,20);
  const W=760,H=200,VH=hasVolume?56:0,padX=8,padTop=8,padBottom=8;
  const n=series.length;
  const highs=series.map(c=>c.high),lows=series.map(c=>c.low);
  const maxP=Math.max(...highs),minP=Math.min(...lows),span=(maxP-minP)||1;
  const chartH=H-padTop-padBottom;
  const y=v=>padTop+chartH*(1-(v-minP)/span);
  const slotW=(W-2*padX)/n,bodyW=Math.max(2,slotW*0.6);
  const maxV=hasVolume?Math.max(...series.map(c=>c.volume||0))||1:1;
  const volY0=H+6;
  const mkPoly=arr=>arr.map((v,i)=>v==null?null:`${padX+slotW*(i+0.5)},${y(v)}`).filter(Boolean).join(' ');
  return e("svg",{viewBox:`0 0 ${W} ${H+VH+6}`,width:"100%",height:H+VH+6,style:{display:"block"},preserveAspectRatio:"none"},
    [0,1,2,3,4].map(g=>e("line",{key:"g"+g,x1:0,x2:W,y1:padTop+chartH*g/4,y2:padTop+chartH*g/4,stroke:"rgba(0,0,0,.06)"})),
    series.map((c,i)=>{
      const cx=padX+slotW*(i+0.5),up=c.close>=c.open,col=up?"#0E9F6E":"#E05555";
      const bT=y(Math.max(c.open,c.close)),bB=y(Math.min(c.open,c.close));
      return e("g",{key:i},
        e("line",{x1:cx,x2:cx,y1:y(c.high),y2:y(c.low),stroke:col,strokeWidth:1.2}),
        e("rect",{x:cx-bodyW/2,y:bT,width:bodyW,height:Math.max(1,bB-bT),fill:col}));
    }),
    e("polyline",{points:mkPoly(ma5),fill:"none",stroke:"#5B6EE1",strokeWidth:1.6}),
    e("polyline",{points:mkPoly(ma20),fill:"none",stroke:"#DB9B2E",strokeWidth:1.6}),
    hasVolume&&series.map((c,i)=>{
      const cx=padX+slotW*(i+0.5),up=c.close>=c.open,h=VH*0.85*((c.volume||0)/maxV);
      return e("rect",{key:"v"+i,x:cx-bodyW/2,y:volY0+(VH*0.9-h),width:bodyW,height:h,fill:up?"rgba(14,159,110,.5)":"rgba(224,85,85,.5)"});
    }));
}

      e("div",{className:"note",style:{marginBottom:12}},"讓孩子自己在教室電視／平板上點自己的名字，登記答題、忘物、投資、借貸、請假。啟動後畫面會鎖住，只能做這些操作，要離開需要輸入下面設定的 PIN 碼。"),
      e("div",{className:"set-grid"},
        e("div",{className:"field"},e("label",null,"退出用 PIN 碼"),e("input",{className:"inp mono",value:kiosk.pin,onChange:ev=>setS({kiosk:{...kiosk,pin:ev.target.value}}),placeholder:"例如 1234"})),
        e("div",{className:"field"},e("label",null,"每次操作冷卻秒數"),e("input",{className:"inp mono",value:kiosk.cooldown,onChange:ev=>setS({kiosk:{...kiosk,cooldown:Math.max(0,Number(ev.target.value)||0)}})}))),
      e("div",{style:{marginTop:12}},
        e("button",{
          className:"btn in",
          disabled:!kiosk.pin,
          onClick:()=>setKioskMode(true)
        },"🖥️ 啟動大螢幕模式")),
      !kiosk.pin&&e("div",{className:"note",style:{color:"var(--red)",marginTop:6}},"請先設定 PIN 碼才能啟動（不然畫面鎖住後就沒辦法離開了）。")),
    e("div",{className:"panel"},
      e("div",{style:{fontWeight:700,marginBottom:8}},"資料安全"),
      e("div",{className:"saved",style:{marginBottom:10}},e("span",{className:"dot"}),"資料存在 Google 雲端硬碟",lastSaved?` · 上次儲存 ${clock(lastSaved)}`:""),
      !HAS_GS&&e("div",{className:"note",style:{color:"var(--red)",marginBottom:10}},"⚠️ 尚未設定 SCRIPT_URL！請編輯 index.html 頂部的 SCRIPT_URL 常數，貼上你的 Apps Script 部署網址。目前為離線模式，資料只存在瀏覽器 localStorage。"),
      e("div",{style:{display:"flex",gap:8,flexWrap:"wrap"}},
        dbUrl&&e("a",{className:"btn in",href:dbUrl,target:"_blank",rel:"noreferrer",style:{textDecoration:"none"}},"📊 開啟後台試算表"),
        e("button",{className:"btn gr",onClick:exportData},"匯出全部備份"),
        e("button",{className:"btn gh",onClick:()=>open("io")},"匯入資料"),
        e("button",{className:"btn dg",onClick:()=>open("reset")},"清除全部"))));
}

ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App,null));
</script>
</body>
</html>
